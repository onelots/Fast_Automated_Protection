version: '3.8'

networks:
  admin_network:
    ipam:
      driver: default
      config:
        - subnet: 192.168.100.0/24

services:
  database:
    build: 
      context: ./backend_admin/database
      dockerfile: Dockerfile
    container_name: postgres_admin_database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    networks:
      admin_network:
        ipv4_address: 192.168.100.3
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always

  app:
    build:
      context: ./backend_admin/panel
      dockerfile: Dockerfile
    container_name: panel_admin
    environment:
      DATABASE_URL: postgresql://postgres:postgres@database:5432/admin_database
      PYTHONUNBUFFERED: 1
    networks:
      admin_network:
        ipv4_address: 192.168.100.2
    depends_on:
      - database
    ports:
      - "8000:8000"
    restart: always
    stdin_open: true

  user_test:
    build:
      context: ./backend_client/panel
      dockerfile: Dockerfile
    container_name: panel_client_1
    environment:
      PYTHONUNBUFFERED: 1
    networks:
      admin_network:
        ipv4_address: 192.168.100.4
    ports:
      - "8001:8000"
    depends_on:
      - database
      - app
    restart: always
    stdin_open: true

volumes:
  postgres_data:
